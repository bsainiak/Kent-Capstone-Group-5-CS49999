<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login - Ziy Photos</title>
    
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        nav { background-color: #222; padding: 15px 30px; display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        
        .login-wrapper { display: flex; justify-content: center; align-items: center; height: 80vh; }
        .login-card { background-color: white; padding: 50px 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        .login-card h1 { margin-top: 0; color: #333; }
        .login-card p { color: #666; margin-bottom: 30px; line-height: 1.5; }
        
        #btn-login { background-color: #000; color: #fff; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; }
        #btn-login:hover { background-color: #333; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="aboutMe.html">About Me</a>
        <a href="styles.html">Styles</a>
        <a href="images.html">Images</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Client Login</a>
        <a href="downloads.html">Downloads</a>
    </nav>

    <div class="login-wrapper">
        <div class="login-card">
            <h1>Client Access</h1>
            <p>Securely log in to your account to download your purchased track photos.</p>
            <button id="btn-login">Log In / Register Securely</button>
            <p id="logged-in-msg" style="display: none; color: green; font-weight: bold; margin-top: 20px;">
                You are already logged in!<br><br><a href="downloads.html">Go to your downloads</a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        setTimeout(async () => {
            if (typeof auth0Client !== 'undefined') {
                const isAuthenticated = await auth0Client.isAuthenticated();
                if (isAuthenticated) {
                    document.getElementById('btn-login').style.display = 'none';
                    document.getElementById('logged-in-msg').style.display = 'block';
                }
            }
        }, 1000);
    </script>
</body>
</html>
