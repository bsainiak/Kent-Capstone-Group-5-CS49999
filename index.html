<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="referrer" content="origin">
    <meta charset="UTF-8">
    <title>Danko Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Basic Modal Styling if not in your styles.css */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: #fefefe; margin: 5% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 700px; text-align: center; }
        .modal-content img { max-width: 100%; height: auto; margin-bottom: 20px; }
        .close-modal { float: right; font-size: 28px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo"><a href="index.html"><img src="images/OCRP Logo.png" alt="Logo"></a></div>
    <div class="search-bar"><input type="text" id="search-input" placeholder="Search series or location..."></div>
    <nav class="nav-links">
        <a href="aboutMe.html">About Me</a>
        <a href="contact.html">Contact</a>
        <a href="#" id="featured-download" class="cta-btn">Download Featured Photo</a>
        <a href="https://docs.google.com/forms/..." class="cta-btn" target="_blank">Submit a Request</a>
    </nav>
</header>

<div class="container">
    <aside class="sidebar">
        <ul>
            <li><a href="#" class="sidebar-link" data-search="September 2025">Sep 2025</a></li>
            <li><a href="#" class="sidebar-link" data-search="August 2024">Aug 2024</a></li>
            <li><a href="#" class="sidebar-link" data-search="March 2022">March 2022</a></li>
        </ul>
    </aside>

    <main class="gallery" id="photo-gallery">
        <p>Loading gallery...</p>
    </main>
</div>

<div id="photoModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <img id="modalImage" src="" alt="Selected Photo">
        
        <div id="content"> 
            <h3>Purchase This Photo</h3>
            <div id="alerts"></div>
            <div id="loading"></div> 
            
            <div id="payment_options"></div>
        </div>
    </div>
</div>

<footer>
    <a href="contact.html">Contact</a>
    <a href="#">Copy TAC</a>
</footer>


<script>
    const searchInput = document.getElementById('search-input');
    const gallery = document.getElementById('photo-gallery');
    const modal = document.getElementById('photoModal');
    const modalImg = document.getElementById('modalImage');
    const closeModal = document.querySelector('.close-modal');

    // Gallery Loading Logic
    async function loadGallery(search = '') {
        if (search.toLowerCase() === 'all') search = '';
        try {
            gallery.innerHTML = '<p>Searching...</p>';
            const url = search ? `/api/photos?search=${encodeURIComponent(search)}` : '/api/photos';
            const response = await fetch(url);
            const photos = await response.json();

            gallery.innerHTML = ''; 
            if (photos.length === 0) {
                gallery.innerHTML = `<p class="no-results">No photos found for "${search}".</p>`;
                return;
            }

            photos.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${photo.FilePath}" alt="Gallery Image">`;
                gallery.appendChild(card);
            });
        } catch (err) {
            gallery.innerHTML = "<p>Error loading gallery.</p>";
        }
    }

    gallery.addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG') {
                modal.style.display = "block";
                modalImg.src = e.target.src;

                // 1. Reset the modal UI so the new script has a fresh place to render
                const paymentOptions = document.getElementById('payment_options');
                paymentOptions.innerHTML = ''; 
                document.getElementById('alerts').innerHTML = '';
                document.getElementById('loading').classList.remove('hide');

                // 2. Remove any previous instances of script.js to prevent conflicts
                const oldScript = document.getElementById('paypal-execution-script');
                if (oldScript) oldScript.remove();

                // 3. Inject the script with a unique ID and timestamp
                const script = document.createElement('script');
                script.id = 'paypal-execution-script';
                script.src = "script.js?t=" + new Date().getTime(); 
                document.body.appendChild(script);
                
                console.log("Loading payment for: " + e.target.src);
        }
    });

    closeModal.onclick = () => modal.style.display = "none";
    window.onclick = (event) => { if (event.target == modal) modal.style.display = "none"; };

   
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadGallery(searchInput.value.trim());
    });

    document.querySelectorAll('.sidebar-link').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const term = link.getAttribute('data-search');
            searchInput.value = term;
            loadGallery(term);
        });
    });

    // Initialize
    window.onload = () => loadGallery();

    // Featured Download Logic
    const mockPhotoPath = "images/_DSC5696.jpg"; 
    const downloadBtn = document.getElementById('featured-download');
    downloadBtn.href = mockPhotoPath;
    downloadBtn.setAttribute('download', "featured_image.jpg");
</script>

<!--<script src="script.js"></script>-->

</body>
</html>
