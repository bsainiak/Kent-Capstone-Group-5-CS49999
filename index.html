<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="referrer" content="origin">
        <meta charset="UTF-8">
        <title>Danko Gallery</title>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="styles.css">
        <style>
            /* Fallback Modal Styling */
            .modal
            {
                display: none;
                position: fixed;
                z-index: 1000;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0,0,0,0.8);
            }
            .modal-content
            {
                background-color: #fefefe;
                margin: 5% auto;
                padding: 20px;
                border: 1px solid #888;
                width: 80%;
                max-width: 700px;
                text-align: center;
            }
            .modal-content img
            {
                max-width: 100%;
                height: auto;
                margin-bottom: 20px;
            }
            .close-modal
            {
                float: right;
                font-size: 28px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="logo">
                <a href="index.html"><img src="images/OCRP Logo.png" alt="Logo"></a>
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search series or location...">
            </div>
            <nav class="nav-links">
                <a href="about.html">About Me</a>
                <a href="contact.html">Contact</a>
                <a href="#" class="cta-btn">Submit a Request</a>
            </nav>
        </header>
        <div class="container">
            <aside class="sidebar">
                <ul>
                    <li>
                        <a href="#" class="sidebar-link" data-search="September 2025">Sep 2025</a>
                    </li>
                    <li>
                        <a href="#" class="sidebar-link" data-search="August 2024">Aug 2024</a>
                    </li>
                    <li>
                        <a href="#" class="sidebar-link" data-search="March 2022">March 2022</a>
                    </li>
                </ul>
            </aside>
            <main class="gallery" id="photo-gallery">
                <p>Loading gallery...</p>
            </main>
        </div>
        <div id="photoModal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <img id="modalImage" src="" alt="Selected Photo">
                <div id="content"> 
                    <h3>Purchase This Photo</h3>
                    <div id="alerts"></div>
                    <div id="loading"></div> 
                    <div id="payment_options"></div>
                </div>
            </div>
        </div>
        <footer>
            <a href="contact.html">Contact</a>
            <a href="#">Copy TAC</a>
        </footer>
    </body>
</html>
